stages:
  - build
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_REGISTRY: "$CI_REGISTRY"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

# ---------- Reusable templates ----------

.maven_build_template:
  image: maven:3.9-eclipse-temurin-21
  stage: build
  script:
    - mvn -B -pl $MODULE -am clean compile

.maven_test_template:
  image: maven:3.9-eclipse-temurin-21
  stage: test
  script:
    - mvn -B -pl $MODULE -am test
  artifacts:
    when: always
    reports:
      junit:
        - "$MODULE/target/surefire-reports/TEST-*.xml"
    paths:
      - "$MODULE/target/*.jar"
    expire_in: 1 hour

.docker_build_template:
  image: docker:24
  stage: docker
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f $MODULE/Dockerfile -t $CI_REGISTRY_IMAGE/$MODULE:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/$MODULE:latest .
    - docker push $CI_REGISTRY_IMAGE/$MODULE:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/$MODULE:latest

# ---------- order-service ----------

build:order-service:
  extends: .maven_build_template
  variables:
    MODULE: order-service
  rules:
    - changes:
        - order-service/**/*
        - base-service/**/*
        - pom.xml

test:order-service:
  extends: .maven_test_template
  variables:
    MODULE: order-service
  needs: ["build:order-service"]
  rules:
    - changes:
        - order-service/**/*
        - base-service/**/*
        - pom.xml

docker:order-service:
  extends: .docker_build_template
  variables:
    MODULE: order-service
  needs: ["test:order-service"]
  rules:
    - changes:
        - order-service/**/*
        - base-service/**/*
        - pom.xml

