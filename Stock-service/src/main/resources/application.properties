spring.application.name:Stock-service
server.port:8082
spring.order.topic.name=order_topics
spring.kafka.bootstrap-servers[]:localhost:9092
spring.kafka.consumer.key-deserializer:org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer:org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group_id:stock
spring.kafka.consumer.properties.spring.json.trusted.packages:*


spring.datasource.url=jdbc:h2:file:./data/stockdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=mu11a
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
